<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ЭкоСкан — Анализ продуктов</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #F6F7F9;
            --card-bg: rgba(255, 255, 255, 0.85);
            --text-main: #1C1C1E;
            --text-secondary: #8E8E93;
            --accent-green: #34C759;
            --accent-orange: #FF9500;
            --accent-pink: #FF2D55;
            --font-led: 'Courier New', Courier, monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 16px;
            padding-bottom: 90px;
            max-width: 480px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .app-title {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .user-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 0, 0, 0.04);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
        }

        .user-avatar {
            width: 24px;
            height: 24px;
            background: #007AFF;
            color: #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 700;
        }

        /* Capsule Trend */
        .trend-capsule {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 14px 18px;
            margin-bottom: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .trend-header {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .trend-status {
            font-weight: 600;
            color: var(--text-main);
        }

        .progress-bar-bg {
            width: 100%;
            height: 6px;
            background: rgba(0, 0, 0, 0.06);
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-bar-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #34C759, #007AFF);
            border-radius: 3px;
            transition: width 0.6s ease;
        }

        /* Bento Grid */
        .bento-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 16px;
        }

        .bento-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 120px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
            position: relative;
            overflow: hidden;
        }

        .bento-card.full-width {
            grid-column: span 2;
        }

        .bento-label {
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .bento-value {
            font-family: var(--font-led);
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 1px;
            margin-top: 8px;
        }

        /* Mesh Gradients */
        .mesh-green { background: linear-gradient(135deg, rgba(52, 199, 89, 0.15), rgba(0, 122, 255, 0.05)); }
        .mesh-orange { background: linear-gradient(135deg, rgba(255, 149, 0, 0.15), rgba(255, 45, 85, 0.05)); }
        .mesh-pink { background: linear-gradient(135deg, rgba(255, 45, 85, 0.15), rgba(175, 82, 222, 0.05)); }

        /* Scanner Trigger Card */
        .scanner-card {
            background: linear-gradient(135deg, #1C1C1E, #2C2C2E);
            color: #fff;
            border-radius: 24px;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
            margin-bottom: 16px;
        }

        .scanner-info h3 {
            font-size: 16px;
            margin-bottom: 4px;
        }

        .scanner-info p {
            font-size: 12px;
            color: #8E8E93;
        }

        .scanner-icon-btn {
            width: 48px;
            height: 48px;
            background: rgba(255,255,255,0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        /* Camera Modal Overlay */
        #camera-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            z-index: 1000;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }

        #camera-feed {
            width: 100%;
            height: 70vh;
            object-fit: cover;
            border-radius: 24px;
        }

        .camera-controls {
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        .btn-capture {
            width: 70px; height: 70px;
            background: #fff;
            border-radius: 50%;
            border: 4px solid rgba(255,255,255,0.4);
            cursor: pointer;
        }

        .btn-close-cam {
            background: rgba(255,255,255,0.2);
            color: #fff;
            border: none;
            padding: 12px 24px;
            border-radius: 14px;
            font-weight: 600;
        }

        /* Bottom Nav */
        .bottom-nav {
            position: fixed;
            bottom: 16px;
            left: 16px;
            right: 16px;
            background: rgba(28, 28, 30, 0.9);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 10px 20px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            max-width: 448px;
            margin: 0 auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .nav-item {
            color: #8E8E93;
            text-align: center;
            font-size: 10px;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }

        .nav-item.active {
            color: #fff;
        }

        .nav-item span {
            font-size: 18px;
        }

        /* Diary log list */
        .diary-section {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.03);
        }

        .diary-title {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .diary-empty {
            font-size: 13px;
            color: var(--text-secondary);
            text-align: center;
            padding: 20px 0;
        }

        .diary-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid rgba(0,0,0,0.04);
            font-size: 13px;
        }
    </style>
</head>
<body>

    <header>
        <div class="app-title">ЭкоСкан</div>
        <div class="user-badge">
            <div class="user-avatar" id="user-initial">М</div>
            <span id="user-name">Макс</span>
        </div>
    </header>

    <!-- Trend Capsule -->
    <div class="trend-capsule">
        <div class="trend-header">
            <span>Рацион сегодня</span>
            <span class="trend-status" id="trend-text">Пусто (начните сканирование)</span>
        </div>
        <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="progress-fill"></div>
        </div>
    </div>

    <!-- Bento Grid (Start from 0) -->
    <div class="bento-grid">
        <div class="bento-card mesh-pink">
            <div class="bento-label">Индекс чистоты</div>
            <div class="bento-value" id="val-purity">0%</div>
        </div>
        <div class="bento-card mesh-orange">
            <div class="bento-label">Сахар</div>
            <div class="bento-value" id="val-sugar">0 г</div>
        </div>
        <div class="bento-card mesh-green">
            <div class="bento-label">Белок</div>
            <div class="bento-value" id="val-protein">0 г</div>
        </div>
        <div class="bento-card mesh-orange">
            <div class="bento-label">Е-добавки</div>
            <div class="bento-value" id="val-e">0</div>
        </div>
    </div>

    <!-- Scanner Trigger -->
    <div class="scanner-card" onclick="openCameraScanner()">
        <div class="scanner-info">
            <h3>Сканировать продукт</h3>
            <p>Наведите камеру на этикетку состава</p>
        </div>
        <div class="scanner-icon-btn">📷</div>
    </div>

    <!-- Diary Feed -->
    <div class="diary-section">
        <div class="diary-title">Дневник питания</div>
        <div id="diary-list" class="diary-empty">Список продуктов пуст. Отсканируйте первую этикетку!</div>
    </div>

    <!-- Bottom Nav -->
    <nav class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('home')">
            <span>🏠</span>Главная
        </div>
        <div class="nav-item" onclick="openCameraScanner()">
            <span>📷</span>Сканер
        </div>
        <div class="nav-item" onclick="switchTab('diary')">
            <span>📖</span>Дневник
        </div>
    </nav>

    <!-- Camera View Modal -->
    <div id="camera-modal">
        <div style="color: #fff; text-align: center; font-weight: 600; padding-top: 10px;">Наведите на этикетку состава</div>
        <video id="camera-feed" autoplay playsinline></video>
        <div class="camera-controls">
            <button class="btn-close-cam" onclick="closeCameraScanner()">Закрыть</button>
            <button class="btn-capture" onclick="captureProduct()"></button>
            <div style="width: 70px;"></div>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        // Set user name if available from Telegram
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            const firstName = tg.initDataUnsafe.user.first_name || "Макс";
            document.getElementById('user-name').innerText = firstName;
            document.getElementById('user-initial').innerText = firstName.charAt(0).toUpperCase();
        }

        let mediaStream = null;

        async function openCameraScanner() {
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('medium');
            }
            const modal = document.getElementById('camera-modal');
            modal.style.display = 'flex';
            
            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'environment' } 
                });
                document.getElementById('camera-feed').srcObject = mediaStream;
            } catch (err) {
                alert('Не удалось получить доступ к камере. Убедитесь, что разрешили её в настройках браузера.');
                closeCameraScanner();
            }
        }

        function closeCameraScanner() {
            const modal = document.getElementById('camera-modal');
            modal.style.display = 'none';
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
                mediaStream = null;
            }
        }

        function captureProduct() {
            if (tg.HapticFeedback) {
                tg.HapticFeedback.notificationOccurred('success');
            }
            closeCameraScanner();

            // Simulate AI parsing result for the scanned product
            document.getElementById('trend-text').innerText = 'Отличный рацион';
            document.getElementById('progress-fill').style.width = '85%';
            document.getElementById('val-purity').innerText = '92%';
            document.getElementById('val-sugar').innerText = '3.5 г';
            document.getElementById('val-protein').innerText = '14.2 г';
            document.getElementById('val-e').innerText = '0';

            const diaryList = document.getElementById('diary-list');
            diaryList.className = '';
            diaryList.innerHTML = `
                <div class="diary-item">
                    <span>Греческий йогурт натуральный</span>
                    <strong style="color: #34C759;">Чистый состав (92%)</strong>
                </div>
            `;
        }

        function switchTab(tab) {
            if (tg.HapticFeedback) {
                tg.HapticFeedback.selectionChanged();
            }
            if(tab === 'diary') {
                alert('Здесь отображается история всех отсканированных продуктов за сегодня.');
            }
        }
    </script>
</body>
</html>
